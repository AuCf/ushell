name: Release uShell App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'uShell ${{ github.ref_name }}'
          releaseBody: |
            ## ⚡ uShell ${{ github.ref_name }} Release
            
            Ultra-Minimalist Geek SSH & SFTP Desktop Client.
            
            ### 📦 Supported Platforms:
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `aarch64-apple-darwin` (`.dmg` / `.app`)
            - **macOS Intel (x86_64)**: `x86_64-apple-darwin` (`.dmg` / `.app`)
            - **Windows x64**: `x86_64-pc-windows-msvc` (`.exe` / `.msi` / `.nsis`)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
